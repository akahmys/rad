[package]
name = "rad-abi"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The one contract the kernel and every module must agree on. Kept deliberately
# tiny: opaque dispatch means the kernel never parses a payload, so `serde` is
# the only dependency this needs, and it builds for both native and
# wasm32-wasip2 without conditionals.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }

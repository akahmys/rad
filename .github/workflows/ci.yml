name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check Secrets and Absolute Paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history. `actions/checkout` clones at depth 1 by default, and
          # `betterleaks git` on a one-commit clone reports "no leaks found" —
          # indistinguishable from a real pass while having scanned nothing.
          # Verified locally: a --depth 1 clone of this repo passes the scan
          # despite 222 commits of history existing.
          fetch-depth: 0

      # Pinned release tarball rather than `curl | sh`: the version is visible
      # here, an upstream change cannot silently alter what runs, and there is
      # no install script to trust. (An earlier revision piped an install.sh
      # that does not exist, so the scanner was never installed and the whole
      # job failed on `command not found`.)
      - name: Install betterleaks
        env:
          BETTERLEAKS_VERSION: 1.7.3
        # `shell: bash` on every multi-line `run`: a Windows runner would
        # default to PowerShell and reject `\` continuations. Stated even on
        # Linux-only jobs so adding an OS matrix later cannot break them.
        shell: bash
        run: |
          curl -sSfL -o /tmp/betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/betterleaks.tar.gz -C /tmp betterleaks
          sudo install -m 0755 /tmp/betterleaks /usr/local/bin/betterleaks
          betterleaks version

      # Rules — secrets and the personal-information patterns — live in
      # .betterleaks.toml. Scans full history, not just HEAD: a secret removed
      # from the tip is still published.
      - name: Run secret scanner
        run: betterleaks git --no-banner --redact .

  build-and-test:
    name: Build & Test
    needs: check-secrets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: clippy

      # The integration suite loads real `.wasm` components off disk, so
      # without this step `cargo test` fails on the first such binary and
      # cargo stops — 82 of 195 tests run and the rest are never attempted.
      # Building here rather than depending on the wasm job because jobs do not
      # share a workspace.
      - name: Build Wasm components for the integration suite
        # Explicit shell: Windows runners default to PowerShell, which does not
        # accept `\` line continuations and failed with "unexpected argument".
        shell: bash
        run: |
          cargo build --target wasm32-wasip2 \
            -p rad-orchestrator -p llm-connector -p security-guard \
            -p mcp-tool-provider -p skill-tool-provider \
            -p context-module -p echo-module -p relay-module

      # `--workspace` is required, not decorative: without it cargo selects only
      # the root package, silently skipping every test in `ext/*` and `models/`
      # — 52 of 149, about a third of the suite. See README §2.3.
      # Dependency license policy lives in deny.toml. Allow-only: a crate must
      # be positively permitted, not merely absent from a blacklist.
      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  # Its own job, not a step inside build-and-test: that runs a three-OS matrix
  # and cargo-deny-action is a Linux container, so it would fail on macOS and
  # Windows. Dependency licences do not vary by runner anyway.
  licenses:
    name: License Audit
    needs: check-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The upstream action rather than `cargo install cargo-deny`, which built
      # from source on every run — and was written `|| true`, so a failed
      # install left the audit silently skipped.
      - name: License audit
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  wasm-extensions:
    name: Build & Lint Wasm Extensions
    needs: check-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: clippy

      # Extensions ship as wasm32-wasip2 components. A native-only check misses
      # target-specific breakage, so lint and build them for the real target.
      - name: Clippy (wasm32-wasip2)
        # `shell: bash` on every multi-line `run`: a Windows runner would
        # default to PowerShell and reject `\` continuations. Stated even on
        # Linux-only jobs so adding an OS matrix later cannot break them.
        shell: bash
        run: |
          cargo clippy --target wasm32-wasip2 \
            -p rad-orchestrator -p llm-connector -p security-guard \
            -p mcp-tool-provider -p skill-tool-provider -p context-module \
            -- -D warnings

      - name: Build (wasm32-wasip2)
        # `shell: bash` on every multi-line `run`: a Windows runner would
        # default to PowerShell and reject `\` continuations. Stated even on
        # Linux-only jobs so adding an OS matrix later cannot break them.
        shell: bash
        run: |
          cargo build --target wasm32-wasip2 \
            -p rad-orchestrator -p llm-connector -p security-guard \
            -p mcp-tool-provider -p skill-tool-provider -p context-module

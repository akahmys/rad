name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check Secrets and Absolute Paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install betterleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/betterleaks/betterleaks/main/install.sh \
            | sh -s -- -b /usr/local/bin || go install github.com/betterleaks/betterleaks@latest

      # Rules — secrets and the personal-information patterns — live in
      # .betterleaks.toml. Scans full history, not just HEAD: a secret removed
      # from the tip is still published.
      - name: Run secret scanner
        run: betterleaks git --no-banner --redact .

  build-and-test:
    name: Build & Test
    needs: check-secrets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      # `--workspace` is required, not decorative: without it cargo selects only
      # the root package, silently skipping every test in `ext/*` and `models/`
      # — 52 of 149, about a third of the suite. See README §2.3.
      # Dependency license policy lives in deny.toml. Allow-only: a crate must
      # be positively permitted, not merely absent from a blacklist.
      - name: License audit
        run: |
          cargo install --locked cargo-deny || true
          cargo deny check licenses

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  wasm-extensions:
    name: Build & Lint Wasm Extensions
    needs: check-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-wasip2
          components: clippy

      # Extensions ship as wasm32-wasip2 components. A native-only check misses
      # target-specific breakage, so lint and build them for the real target.
      - name: Clippy (wasm32-wasip2)
        run: |
          cargo clippy --target wasm32-wasip2 \
            -p rad-orchestrator -p llm-connector -p security-guard \
            -p mcp-tool-provider -p skill-tool-provider -p context-module \
            -- -D warnings

      - name: Build (wasm32-wasip2)
        run: |
          cargo build --target wasm32-wasip2 \
            -p rad-orchestrator -p llm-connector -p security-guard \
            -p mcp-tool-provider -p skill-tool-provider -p context-module

# Dependency license policy, replacing `scripts/check_licenses.py`.
#
# The intent is unchanged: keep copyleft and unapproved licenses out of the
# dependency tree. The implementation changes because the hand-rolled version
# got two things wrong in ways that mattered.
#
# It treated a crate with *no* declared license as acceptable — the one case
# with no grant of rights at all, and so the most dangerous. cargo-deny rejects
# it by default.
#
# And it matched licenses by substring, so `MIT-advertising` passed on the
# strength of containing "mit" despite being a different licence with an
# advertising clause. cargo-deny evaluates the SPDX expression properly,
# including `AND`, `OR`, and `WITH` exceptions.

[licenses]
# Same set the previous script allowed. An `OR` expression passes if any branch
# is allowed, which is what made `MIT OR Apache-2.0` — most of the Rust
# ecosystem — acceptable before.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Trimmed from the previous script's list: 0BSD, CC0-1.0 and
    # Unicode-DFS-2016 are not used by anything in the tree, and cargo-deny
    # warns about allowances nobody exercises. Re-add if a dependency needs one
    # — the warning is the prompt to make that a decision rather than a default.
    "OpenSSL",
    "MPL-2.0",
    "BSL-1.0",
]

# A crate has to be clearly allowed, not merely not-denied. There is no
# blacklist here on purpose: the previous script listed gpl/lgpl/agpl, which
# only stops the copyleft licences someone thought to name. Allow-only stops
# everything nobody vetted, including the next licence that has not been
# invented yet.
confidence-threshold = 0.9

[[licenses.clarify]]
# `ring` ships a LICENSE file but no SPDX field, so it reads as unlicensed —
# the case the previous script waved through. Its own LICENSE states the
# situation plainly: ISC-style for new code, OpenSSL licensing for the parts
# derived from BoringSSL. All three terms are on the allow list above, so this
# records what it is rather than granting it an exemption.
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Not enabled as policy — no crate is banned and duplicates are tolerated.
# Present so `cargo deny check` runs the section rather than erroring on a
# missing one.
multiple-versions = "allow"
wildcards = "allow"

[advisories]
# Vulnerability scanning is a different job from license compliance and needs a
# fetched advisory database, which would make an offline build fail for a reason
# unrelated to what it was asked to check. Worth turning on deliberately, as its
# own decision, not as a side effect of replacing the license script.
unmaintained = "none"
yanked = "allow"

[sources]
# Only crates.io and git dependencies already in the tree.
unknown-registry = "deny"
unknown-git = "allow"

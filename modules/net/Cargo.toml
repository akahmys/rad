[package]
name = "net-module"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Exercises the `net-open` syscall from inside a module: a body read to
# completion, a transport failure that has to arrive as an error rather than as
# an empty read, and the retry loop around "nothing yet".
[lib]
crate-type = ["cdylib"]

[dependencies]
rad-sdk = { path = "../../crates/rad-sdk" }
serde = { workspace = true }
serde_json = { workspace = true }
wit-bindgen = { workspace = true }

# A test fixture, not something a user installs. `scripts/build_all.sh` still
# builds it (the integration suite needs the component) but does not copy it to
# `~/.rad/wasm`.
[package.metadata.rad]
ship = false

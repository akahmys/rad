[package]
name = "echo-module"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The smallest possible module. Its job is to prove the path end to end —
# SDK to wasm component to kernel — not to be useful.
[lib]
crate-type = ["cdylib"]

[dependencies]
rad-sdk = { path = "../../crates/rad-sdk" }
serde = { workspace = true }
wit-bindgen = { workspace = true }

# A test fixture, not something a user installs. `scripts/build_all.sh` still
# builds it (the integration suite needs the component) but does not copy it to
# `~/.rad/wasm`. Declared here rather than in a list inside the script, because
# every hand-maintained list of components in this repo has drifted at least
# once.
[package.metadata.rad]
ship = false

[package]
name = "dag-module"
version = "0.1.0"
edition = "2024"
license = "MIT"

# The conversation graph, as a kernel module (ARCHITECTURE-NEXT.md §9.3 stage
# 9). Ported from `models/src/dag.rs` plus the persistence `src/session.rs`
# was doing on the host's behalf.
[lib]
crate-type = ["cdylib"]

[dev-dependencies]
tempfile = "3.8"

[dependencies]
rad-sdk = { path = "../../crates/rad-sdk" }
# The graph itself, not a copy of it. `rad-models` depends on serde and nothing
# else, and `ext/rad-orchestrator` already proves it builds for wasm32-wasip2 —
# so there is no reason for this module to carry its own `Dag`, and every
# reason not to: two copies of the one structure a session cannot lose is two
# things to keep in step.
rad-models = { path = "../../models" }
serde = { workspace = true }
serde_json = { workspace = true }
wit-bindgen = { workspace = true }
